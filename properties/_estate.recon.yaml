# Estate recon list — candidate properties, not configured properties.
#
# Onboarding a property means writing `properties/<domain>.yaml`. But you have
# to decide WHICH of 20+ domains to onboard first, and that decision should
# itself come from evidence rather than from whoever shouts loudest.
#
# This file is that input: the domains 8x owns that have no config yet. The
# recon pass (`npm run recon`) crawls each one with the same crawler adapter and
# the same technical detector the full pipeline uses, so the shortlist it
# produces is engine output, not an opinion.
#
# The leading underscore keeps it out of `listPropertyDomains()` — these are
# candidates, and treating them as properties would make `--all` runs and the
# onboarding check operate on domains nobody has configured.
#
# Source for this list: docs/01-research.md §1 (app-store developer records,
# iOS developer id 1894971455 + Google Play developer "8x"), verified
# 2026-08-04. 8x-internal.com is deliberately absent: it is their internal
# portal, not a growth property, and recon does not crawl internal systems.

crawl:
  maxPages: 6
  requestsPerSecond: 1

candidates:
  - domain: 8x.social
    name: 8x Creators
    note: flagship — managed creator network, ships 18 locales
  - domain: heyluma.app
    name: "Luma: Talk it Out"
  - domain: steadiapp.co
    name: "Steadi: Freelancer Budget"
    note: same category as pocketpal.me — arbitration candidate
  - domain: ingatikrecall.com
    name: "Ingatik: Recall"
  - domain: getlaut.app
    name: "Laut: PDF Text to Speech"
  - domain: brawnix.fitness
    name: Brawnix
  - domain: ledgxa.com
    name: "Ledgexa: Invoice & Get Paid"
  - domain: alaria.app
    name: Alaria
    note: launched 2026-08-03, the day before the assignment — the cold-start case
  - domain: falia.app
    name: Falia
    note: Android only
